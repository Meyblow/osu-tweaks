name: Build & Release Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build plugin
      run: dotnet build -c Release --no-restore

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: osu-tweaks-build
        path: bin/Release/net8.0/*.zip

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net8.0/*.zip
        generate_release_notes: true
        name: "osu!tweaks v1.0.0"
        body: |
          ## 🛠️ osu!tweaks v1.0.0 — Initial Release

          ### ✨ Что нового:
          - **Модульный конструктор тулбара**: Полная кастомизация верхнего тулбара с поддержкой Drag & Drop, перемещением между зонами (Лево, Центр, Право), готовыми пресетами и разделителями (Spacers).
          - **Скрытие ненужных кнопок с поддержкой хоткеев**: Скрывайте любые иконки с тулбара без потери функционала — они продолжают открываться по нативным хоткеям игры (`Ctrl+O`, `F8`, `F9` и т.д.).
          - **Перетаскиваемая плашка настройки**: Информационную панель режима редактирования можно свободно перемещать зажатием ЛКМ в любое место экрана.
          - **Выпадающий список режимов автоскипа**:
            - `Выкл` — стандартное поведение игры.
            - `Автоскип мид-мап брейков` — автоматический пропуск пауз между нотами в середине карты.
            - `Автоскип всего (интро, брейки, аутро)` — мгновенный пропуск долгого вступления, перерывов и завершения карты.
          - **Умное контекстное меню**: Закрывается в один клик при нажатии в любую область экрана.
          - **Максимальная производительность**: Чистая event-driven архитектура и $O(1)$ алгоритм отслеживания брейков без лишней нагрузки на процессор.

          ### 📥 Установка:
          1. Скачайте архив `plugin-osu-tweaks-1.0.0.zip` ниже.
          2. Поместите его в папку `%APPDATA%\osu\osu-cc\plugins\`.
          3. Запустите osu!cc.
